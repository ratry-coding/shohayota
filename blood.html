<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>রক্তের সহায়তা - Shohayota</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- নিজের CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-light">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Shohayota
            </a>

            <div class="navbar-nav">

                <a class="nav-link" href="index.html">
                    Home
                </a>

                <a class="nav-link active" href="blood-help.html">
                    Blood Help
                </a>

            </div>

        </div>

    </nav>


    <!-- Blood Help Form -->

    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center text-danger mb-4">
                            রক্তের সহায়তা প্রয়োজন
                        </h2>

                        <p class="text-center text-muted">
                            আপনার প্রয়োজনীয় তথ্য পূরণ করুন।
                        </p>


                        <form>

                            <!-- Name -->

                            <div class="mb-3">

                                <label for="name" class="form-label">
                                    রোগীর নাম
                                </label>

                                <input 
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    placeholder="রোগীর নাম লিখুন"
                                    required>

                            </div>


                            <!-- Blood Group -->

                            <div class="mb-3">

                                <label for="blood" class="form-label">
                                    প্রয়োজনীয় রক্তের গ্রুপ
                                </label>

                                <select 
                                    class="form-select"
                                    id="blood"
                                    required>

                                    <option value="">
                                        রক্তের গ্রুপ নির্বাচন করুন
                                    </option>

                                    <option>A+</option>
                                    <option>A-</option>

                                    <option>B+</option>
                                    <option>B-</option>

                                    <option>AB+</option>
                                    <option>AB-</option>

                                    <option>O+</option>
                                    <option>O-</option>

                                </select>

                            </div>


                            <!-- Blood Bags -->

                            <div class="mb-3">

                                <label for="bags" class="form-label">
                                    কত ব্যাগ রক্ত প্রয়োজন?
                                </label>

                                <input 
                                    type="number"
                                    class="form-control"
                                    id="bags"
                                    min="1"
                                    placeholder="যেমন: 2"
                                    required>

                            </div>


                            <!-- Hospital -->

                            <div class="mb-3">

                                <label for="hospital" class="form-label">
                                    হাসপাতালের নাম
                                </label>

                                <input 
                                    type="text"
                                    class="form-control"
                                    id="hospital"
                                    placeholder="হাসপাতালের নাম লিখুন"
                                    required>

                            </div>


                            <!-- Location -->

                            <div class="mb-3">

                                <label for="location" class="form-label">
                                    হাসপাতালের ঠিকানা
                                </label>

                                <textarea
                                    class="form-control"
                                    id="location"
                                    rows="2"
                                    placeholder="হাসপাতালের ঠিকানা লিখুন"
                                    required></textarea>

                            </div>


                            <!-- Date -->

                            <div class="mb-3">

                                <label for="date" class="form-label">
                                    রক্ত প্রয়োজনের তারিখ
                                </label>

                                <input 
                                    type="date"
                                    class="form-control"
                                    id="date"
                                    required>

                            </div>


                            <!-- Mobile -->

                            <div class="mb-3">

                                <label for="phone" class="form-label">
                                    যোগাযোগের মোবাইল নম্বর
                                </label>

                                <input 
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    placeholder="01XXXXXXXXX"
                                    required>

                            </div>


                            <!-- Additional Information -->

                            <div class="mb-3">

                                <label for="message" class="form-label">
                                    অতিরিক্ত তথ্য
                                </label>

                                <textarea
                                    class="form-control"
                                    id="message"
                                    rows="3"
                                    placeholder="রোগীর অবস্থা বা অন্য কোনো প্রয়োজনীয় তথ্য লিখুন"></textarea>

                            </div>


                            <!-- Submit -->

                            <div class="text-center">

                                <button 
                                    type="submit"
                                    class="btn btn-danger px-5">

                                    রক্তের জন্য আবেদন করুন

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
