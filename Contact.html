<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Shohayota</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-light">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Shohayota
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="help.html">
                        Help Needed
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="donate.html">
                        Donate
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">
                        About Us
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </div>
    </nav>


    <!-- Contact Section -->
    <section class="container mt-5">

        <h1 class="text-center">
            Contact Us
        </h1>

        <p class="text-center">
            আমাদের সাথে যোগাযোগ করতে নিচের ফর্মটি পূরণ করুন।
        </p>


        <div class="card mt-4">

            <div class="card-body">

                <form>

                    <label class="form-label">
                        আপনার নাম
                    </label>

                    <input
                        type="text"
                        class="form-control mb-3"
                        placeholder="নাম লিখুন"
                    >


                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control mb-3"
                        placeholder="Email লিখুন"
                    >


                    <label class="form-label">
                        আপনার Message
                    </label>

                    <textarea
                        class="form-control mb-3"
                        rows="5"
                        placeholder="আপনার কথা লিখুন">
                    </textarea>


                    <button type="submit" class="btn btn-primary">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </section>

</body>

</html>
